server {
    listen 80;

    client_max_body_size 10m;

    location /api {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
