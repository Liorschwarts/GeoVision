services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      PYTHON_SERVICE_URL: http://python-service:8000
    depends_on:
      - python-service

  python-service:
    build: ./python-service
    ports:
      - "8000:8000"
    volumes:
      - ./python-service/models:/app/models
      - ./python-service/data:/app/data
